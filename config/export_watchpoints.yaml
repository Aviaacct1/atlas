# edit: add cleared: {date, by, note}. Never delete an entry; the history is the point.
# Scopes: zagreb (the Zagreb Excel and Word writers), bum (route candidate exports),
# all (every client artefact). Author: Avia Solutions. Created 16 August 2026 on
# John's instruction adopting Meridian's refusal rule.

watchpoints:
  - scope: zagreb
    opened: 2026-08-16
    by: independent review, 16 August 2026, item 1.5
    progress: >
      23 August 2026: the 2022 history point is corrected on the page (3,113,219 from
      the ACI annual dataset) and the two drags are named on the page beside hwF with
      their provenance flagged unconfirmed; the engine instance embeds the same drags
      in its calibrated ramp, so they must NOT be added to config.headwinds as well.
      Remaining before clearing: confirm the drags' provenance against Model 007, and
      run the round-trip (writer output against the page series) - the person clearing
      this entry runs the writers deliberately as part of the clearance and records
      the comparison here.
    reason: >
      zagreb.html applies two hard-coded annual drags (1.0% and 0.7% from 2026) that
      exist nowhere in config/airports/zagreb.yaml, so the Excel and Word writers
      produce numbers that disagree with the screen a client has just seen; and the
      page's 2022 history point reads 5,162 passengers against 1.40m (2021) and 3.72m
      (2023) in the same file. Until the drags live in the config and the history
      point is corrected from the ACI store, a Zagreb client artefact contradicts
      the portal and must not ship.
