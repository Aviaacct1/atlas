# Aircraft body type map for the OAG store.
# Avia Solutions. Version 1.0, 9 August 2026.
#
# Every aircraft_code that appears in C:\Avia\oag.duckdb on service_type J, with the
# aircraft_name the store itself carries and two classifications:
#
#   aisles         1 or 2, the physical cabin aisle count. 0 for aircraft with no
#                  airliner cabin: helicopters, light aircraft, business jets,
#                  freighters and the "equipment varies" placeholder.
#   class          mainline_jet, regional_jet, turboprop or other.
#
# Two fields rather than one because Boeing's segments and the physical aisle count do
# not agree. Boeing's "single aisle" segment excludes regional jets, which are a
# separate segment in the Commercial Market Outlook, while an Embraer 190 and a CRJ900
# both have one aisle. Holding both lets the same store produce either cut:
#
#   Boeing single aisle  =  aisles 1 and class mainline_jet
#   Boeing regional jet  =  class regional_jet
#   Boeing widebody      =  aisles 2
#
# The split between mainline_jet and regional_jet follows the aircraft family as the
# manufacturer designates it, not a seat count: the CRJ, ERJ, E-Jet, Superjet, ARJ21,
# Fokker 70, BAe 146 and Avro RJ families are regional jets whatever configuration a
# carrier fits, and the 737, A320, A220, 717, MD-80 and MD-90 families are mainline
# whatever configuration a carrier fits. A seat rule would move the Embraer 195 and the
# Fokker 100 between segments as densification changes their seat count, which is the
# very effect the fleet productivity wedge is measuring.
#
# Source for the code list and the names: the aircraft_code and aircraft_name columns of
# the OAG store, read 9 August 2026, 245 distinct codes on service type J.
# Source for the classification: the manufacturer type designation carried in the same
# aircraft_name field.
#
# scripts/guard_oag_wedge.py reports the share of SEATS carried by codes absent from
# this map, and fails above 2%. Add a row when the store gains a code.

