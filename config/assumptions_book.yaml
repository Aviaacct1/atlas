# Avia Global Aviation Forecast - Assumptions Book (canonical parameter store)
# Author: Avia Solutions
# Principle (Data Architecture 5.2): configuration, not code. The Python source
# contains NO numeric assumption. Every tunable in Method Specification v0.1
# section 11 lives here, and is reconciled one-to-one with the Excel Control sheet.
# Values marked P1 are to be confirmed or revised during the UK pilot.

meta:
  spec_version: "Method Specification v0.1"
  base_year: 2025
  history_from: 2000
  horizon_years: 35        # forecast base_year+35 (2060 this year), rolls with the vintage; OEMs do 20, we do 30-35
  horizon: 2060
  author: "Avia Solutions"

# --- Elasticity estimation (Method Spec 4.3-4.4, Elasticity Design) ---
estimation:
  pandemic_years: [2020, 2021, 2022]      # D_covid; never dropped (Elasticity Design 1)
  supply_anomaly_years: [2023, 2024]      # D_supply [P1] revenge demand vs GTF/maintenance-constrained supply (Fable Part B)
  level1_min_obs: 15                       # Method Spec T5 / Elasticity Design 1
  level1_cell_floor_pax: 100000            # cells under 100k pax/yr not regressed at L1 (Elasticity Design 1)
  cov_type_level1: "HC3"                   # Elasticity Design 8
  cov_type_level2: "cluster"               # clustered by airport
  index_base_value: 100                    # all series indexed to first usable year = 100 before logging

# Reliability rule T1-T6 (Method Spec 4.4 table; all P1)
reliability:
  T1_signs: {bG_gt: 0.0, bF_lt: 0.0}
  T2_range: {bG: [0.5, 2.5], bF: [-1.5, -0.1]}
  T3_significance_min_abs_t: 2.0           # on bG
  T4_fit_min_r2: 0.6
  T5_history: {min_obs: 15, min_avg_flow_mppa: 3.0}
  T6_cagr_ratio: [0.5, 1.5]                # implied/regression within +/-50%
  T6_default_window: [2003, 2019]          # clean-year window where clean; recorded per cell

# Applied elasticity final bounds after the rule (Method Spec 4.4)
applied_bounds:
  bG: [0.6, 2.2]
  bF: [-1.1, -0.3]

# Level 2 pooled panel (Elasticity Design 3)
level2:
  min_cells: 3
  min_obs: 45
  weight_cap_share: 0.40                   # no single airport > 40% of panel weight (P1)

# Level 3 precision weighting (Elasticity Design 4)
level3:
  se_lit: 0.25                             # pseudo-standard error of literature prior (P1)

# Literature priors / Level 3 defaults (Method Spec 4.5 table)
# segment -> maturity -> value
level3_defaults:
  Domestic: {bG_mature: 1.0, bG_emerging: 1.5, bF: -0.7}
  International Short Haul: {bG_mature: 1.1, bG_emerging: 1.7, bF: -0.7}
  Long Haul: {bG_mature: 1.3, bG_emerging: 1.8, bF: -0.5}

# Maturity decay (Method Spec 4.5)
maturity:
  lambda: 0.046                            # 15-year half-life (P1)
  bG_inf: {Domestic: 0.8, International Short Haul: 1.0, Long Haul: 1.1}   # P1
  gdp_per_head_threshold_usd: 25000        # 2025 prices (P1)

# --- Fare index (Method Spec 4.2) ---
fare_index:
  pass_through_theta: 0.9                  # over two years (P1)
  real_yield_trend_tau: -0.003             # -0.3%/yr (P1)

# --- Adjustment overlay (Method Spec 4.6) ---
overlay:
  abs_cap_per_year: 0.10                   # |A| <= 10%/yr (P1)
  fleet_decay_years: [5, 10]
  permitted_codes: [FLEET, SECTOR, POLICY, EVENT, OTHER]

# --- Connecting overlay (Method Spec 5) ---
connecting:
  hub_conx_share_threshold: 0.10           # (P1)
  default_hub_share_factor: 1.0

# --- Capacity and spill (Method Spec 6) ---
capacity:
  peak_spreading_allowance: 1.05           # practical annual = 105% of first-binding level (P1)
  spill_curve:                             # utilisation -> spill fraction (P1), linear interpolation
    - {u: 0.85, sp: 0.00}
    - {u: 0.90, sp: 0.01}
    - {u: 0.95, sp: 0.04}
    - {u: 1.00, sp: 0.10}
  conx_spill_multiple: 1.5                 # connecting spills first at 1.5x pro-rata (P1)

# --- Airport-set scope (Phase 1 roll-out; John's selection rule) ---
# Include an airport if it clears the pax floor OR falls within the top-share set of
# national pax. Below-scope airports in a country collapse into one residual
# pseudo-airport so national totals stay whole. The goal floor is the standing
# ambition (model most airports above it), reported as a gap, not binding in v1.
scope:
  inclusion_floor_pax: 2000000             # include any airport at/above 2m pax/yr [P1 John]
  national_coverage_target: 0.80           # or within the smallest top set making up 80% of national pax [P1 John]
  goal_floor_pax: 500000                   # standing ambition floor; below-goal exclusions reported as a gap [P1 John]
  residual_pseudo_suffix: "_RES"           # residual pseudo-airport code per country

# --- Capacity register K-derivation (Capacity Register - Design and Sourcing v0.1) ---
# The engine's K (annual terminal pax) derives from whichever capacity kind exists.
# Grade A: K = declared_mvts_per_hr x operating_hours x seats_per_mvt x load_factor.
# Grade B: K = design_annual_pax_m directly. Grade C: unconstrained (no K).
capacity_register:
  operating_hours_default: 5840            # 16h x 365, [P1]; a noted curfew overrides per row
  seats_per_mvt_default: 150               # [P1] fallback where the row and segment mix give none
  load_factor_default: 0.82                # [P1] fallback load factor
  ab_reconcile_tol: 0.15                   # [P1] where both A and B exist, flag if derived-A vs design-B differ > 15%
  atfm_delay_flag_min_per_arr: 0.5         # [P1] chronic arrival ATFM delay threshold, minutes/arrival (validation proxy)

# --- Aggregation and reconciliation (Method Spec 7) ---
reconciliation:
  residual_share_drift_flag_pp: 3.0        # (P1)
  mirror_flow_tolerance: 0.05              # 5% cell discrepancy (P1)
  parity_tolerance_rel: 0.00001            # 0.001% relative (Method Spec 10)
  watf_country_cagr_explain_pp: 1.0
  global_cagr_band_pp: 0.5

# --- Scenarios (Method Spec 8.1) ---
scenarios:
  Baseline: {gdp_delta_pp: 0.0,  fuel_path: mid,  carbon: scheduled}
  High:     {gdp_delta_pp: 0.5,  fuel_path: low,  carbon: delayed}     # P1
  Low:      {gdp_delta_pp: -0.5, fuel_path: high, carbon: full}        # P1

# --- Coherence tests (Method Spec 8.2) ---
coherence:
  rolling_decade_cagr_max: 0.12
  rolling_decade_cagr_min: -0.03

# --- Backtest (Method Spec 9) ---
backtest:
  fit_window: [2000, 2019]
  forecast_window: [2022, 2026]
  naive_gdp_multiple: 1.5
  acceptance_regions_min: 6                 # of 8
  acceptance_bias_abs: 0.02

# --- Pipeline adjudication, Fable Tier 1 (5 July 2026); amends Method Spec 5.2/6.2/6.4/7.4 ---
pipeline:
  passes: 2                                # two-pass; no fixed point in v1 (Q1)
  connecting_regrow_escalate_pct: 0.02     # T-E: escalate to damped iteration if per-hub gap > 2% of terminal [P1]
  both_ends_vs_capreq_tol: 0.02            # Q2: flow-level suppression vs airport CapReq within 2% [P1]
  max_connections_modelled: 1              # v1 models at most one connection per itinerary (Q3 scope)
  default_final_to_next: sabre_gdd         # Q4: GDD-derived M per airport; nonstop-service fallback; identity only own-region/domestic

# --- Final-to-next mapping M (Method Spec 5.4; Fable Q4, amends the identity default) ---
final_to_next:
  default_source: sabre_gdd                 # GDD itineraries with connect points (Work Order 4.b)
  nonstop_diagonal_share: 0.7               # [P1] direct share where a has nonstop service to region r
  # else remainder routed via the designated hub for the (origin country, region) pair;
  # 100% via hub where no nonstop service; identity only for own-region short-haul and domestic.
  TF_offdiag_vs_conx_tol: 0.10              # [P1] T-F: implied one-connection journeys vs base-year CONX

# --- Redistribution headroom threshold (Method Spec 6.3; Fable Q6 amends Part 1) ---
capacity_redistribution:
  spill_start_threshold: 0.85               # theta [P1] headroom measured to theta*K, not K (no re-spill cascade)

# --- Parameter homes closed from the input-contract audit (Fable, 5 July) ---
# Already homed elsewhere in this book: peak-spreading 1.05 (capacity), ND diagonal 0.7
# and TF tol 0.10 (final_to_next), T-E 2% (pipeline), spill-start theta (capacity_redistribution).
deflators:                                  # H1: CPI deflation convention (Elasticity Design 1)
  source: "IMF CPI"
  outbound_domestic: home_cpi               # fares/GDP deflated by home-market CPI
  inbound: destination_region_cpi_composite # inbound deflated by destination-region CPI composite
saf:
  lifecycle_credit_factor: 0.8              # H2: was a formula literal (OUT-24)
constructed_series:                         # H7: fare-history construction recipe (G1), pending John/Jess
  fare_history_recipe: pending_confirmation # [P1] see CHANGELOG G1: DB1B(NA full) + GDD levels 2020-25 + cost-driven backcast pre-2020 calibrated to the 2020-25 overlap; UK cross-check vs CAA

# --- Fare-elasticity strategy (Fable Part B, 5 July; amends Method Spec 4.2a/4.3/4.4/9) ---
fare_strategy:
  applied_level: segment                    # bF is segment-level (L2/L3), never airport L1
  restricted_level1: true                   # L1 estimates bG on the fare-adjusted series; bF fixed at segment
  estimation_series: counterfactual_in_anomaly_years   # F5: cost-model fares for 2020-24, observed from 2025
  identification_weights:                    # which fuel episodes carry bF identification
    primary: [2014, 2015, 2016]             # clean oil collapse, stable demand
    supporting: [2011, 2012, 2013]
    conditional_on_gfc_dummy: [2008, 2009]
  gds_use: changes_not_levels               # GDS fares used for changes; levels (F15) from DB1B/CAA/GDD
  vfare_tolerance: 0.15                      # [P1] US two-method agreement (DB1B vs cost-driven)
  recipe: "DB1B NA full depth; cost-driven 2000-2019 calibrated to 2014-2019 observed; cost-driven counterfactual 2020-2024; observed/GDD from 2025"

# --- Propensity-to-fly maturity (Cockpit build update B1; replaces Method Spec 4.5 decay) ---
propensity:
  region_asymptote_trips_pc:            # saturation ceiling (trips per capita), region defaults [P1]
    default: 3.0
    "EU+UK": 3.2
    "North America": 3.5
    "Asia Pacific": 2.6
    "Middle East": 3.0
    "Africa": 2.2
    "South America": 2.6
    "Other Europe": 3.0
    Domestic: 3.2
  terminal_tpc_growth: 0.007           # mature floor: growth slows to ~0.7%/yr, never stops (no hard ceiling) [P1 John]
  income_elasticity_tpc: 1.30          # FITTED world-curve slope (Sabre 2025 trips / WB pop / WB GDPpc PPP, 30 countries)

# --- Segment output splits (Cockpit build update B2) ---
segment_splits:
  domestic_excess_factor: 0.55        # domestic keeps 55% of international excess growth [P1]
  floor_rate: 0.0                     # common growth floor both segments share [P1]

# --- Cargo, GA and ATMs (Cockpit build update E1/E2) ---
cargo:
  gdp_elasticity: 1.0                 # cargo tonnage growth per unit GDP growth [P1]
  belly_share: 0.5                    # share of cargo carried in pax belly (rides in pax ATMs) [P1]
  tonnes_per_freighter_atm: 80.0      # freighter payload per ATM [P1]
general_aviation:
  atm_share_note: "GA pax and GA ATMs carry their own growth (analyst input)"
design_day:
  fraction_of_annual_atm: 0.004       # design-day movements as a share of annual ATMs [P1]

# --- BUM: 2-year bottom-up model (Cockpit build update C) ---
bum:
  weeks_per_year: 52
  blend_years_default: 3              # taper BUM-implied growth to the model path over N years
  reconcile_wide_gap_pct: 0.05        # warn if QSI adds move the total more than this vs model [P1]
  base_year_reason_codes: [SCHED-GAP, LF-REVISION, LAUNCH, WITHDRAWAL]

# --- ATM conversion and cargo/GA bases for the derive layer (Cockpit E wiring) ---
atm_conversion:
  seats_per_movement: {Domestic: 150, "International Short Haul": 180, "Long Haul": 280}   # [P1]
  load_factor: {Domestic: 0.80, "International Short Haul": 0.82, "Long Haul": 0.84}        # [P1]
cargo_base:
  tonnage_kt: 1500.0                  # base-year cargo, thousand tonnes (illustrative pending register)
general_aviation_base:
  pax_m: 0.3
  atm_k: 20.0
  growth: 0.02

# --- Population driver (Cockpit B1 propensity) ---
# Base-year population (real): build/data/worldbank_pop_gdppc.json (World Bank = UN Pop Division,
# SP.POP.TOTL 2024). Horizon growth: UN WPP 2024 medium-variant regional averages to 2050 [P1]
# (the UN dataportalapi and the World Bank projection source did not serve programmatically in the
# sandbox; John can export the WPP2024 medium-variant CSV to the project folder for the exact series).
population:
  base_source: "worldbank_pop_gdppc.json (WB SP.POP.TOTL 2024 = UN Pop Division)"
  horizon_source: "un_wpp_population.json (UN WPP 2024 medium variant, 1 July, 2024-2050, per-country exact)"
  growth_by_region:                   # UN WPP 2024 medium variant, avg annual to 2050 [P1]
    Domestic: 0.003
    "EU+UK": 0.001
    "Other Europe": 0.000
    "Africa": 0.021
    "Middle East": 0.011
    "Asia Pacific": 0.004
    "North America": 0.004
    "South America": 0.004

# --- Global drivers (Phase 3 multi-country run) ---
# Regional long-run real GDP growth [P1], applied to every airport by its country's
# region (outbound demand uses home-market GDP, Method Spec 4.1). Per-country OEF
# overrides (Jul 2024 world file on Egnyte) replace these where staged. Maturity of
# the elasticity is set by country GDP per head where known, else by region default.
global_drivers:
  gdp_growth_by_region:
    "EU+UK": 0.015
    "Other Europe": 0.021
    "North America": 0.019
    "South America": 0.024
    "Africa": 0.040
    "Middle East": 0.030
    "Asia Pacific": 0.037
  maturity_gdppc_threshold_usd: 25000      # >= this (PPP) => mature elasticity [P1]
  mature_regions_default: ["EU+UK", "North America"]   # maturity fallback where country GDPpc unknown
  use_estimated_elasticities: false        # [P1 Jess] false = literature bG + propensity (ACI-aligned 3.05%);
  bG_applied_bounds: [0.6, 2.2]           # applied income elasticity clamp (Method Spec 4.3); excludes hub-inflated country estimates pending O&D re-estimation [P1]
                                           # true = long-trend ACI-estimated per-country bG + propensity (4.07%,
                                           # empirical but embeds non-repeating structural gains)
