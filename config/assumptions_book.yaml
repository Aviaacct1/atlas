# Avia Global Aviation Forecast - Assumptions Book (canonical parameter store)
# Author: Avia Solutions
# Principle (Data Architecture 5.2): configuration, not code. The Python source
# contains NO numeric assumption. Every tunable in Method Specification v0.1
# section 11 lives here, and is reconciled one-to-one with the Excel Control sheet.
# Values marked P1 are to be confirmed or revised during the UK pilot.

meta:
  spec_version: "Method Specification v0.1"
  base_year: 2025
  history_from: 2000
  horizon: 2055
  author: "Avia Solutions"

# --- Elasticity estimation (Method Spec 4.3-4.4, Elasticity Design) ---
estimation:
  pandemic_years: [2020, 2021, 2022]      # D_covid; never dropped (Elasticity Design 1)
  supply_anomaly_years: [2023, 2024]      # D_supply [P1] revenge demand vs GTF/maintenance-constrained supply (Fable Part B)
  level1_min_obs: 15                       # Method Spec T5 / Elasticity Design 1
  level1_cell_floor_pax: 100000            # cells under 100k pax/yr not regressed at L1 (Elasticity Design 1)
  cov_type_level1: "HC3"                   # Elasticity Design 8
  cov_type_level2: "cluster"               # clustered by airport
  index_base_value: 100                    # all series indexed to first usable year = 100 before logging

# Reliability rule T1-T6 (Method Spec 4.4 table; all P1)
reliability:
  T1_signs: {bG_gt: 0.0, bF_lt: 0.0}
  T2_range: {bG: [0.5, 2.5], bF: [-1.5, -0.1]}
  T3_significance_min_abs_t: 2.0           # on bG
  T4_fit_min_r2: 0.6
  T5_history: {min_obs: 15, min_avg_flow_mppa: 3.0}
  T6_cagr_ratio: [0.5, 1.5]                # implied/regression within +/-50%
  T6_default_window: [2003, 2019]          # clean-year window where clean; recorded per cell

# Applied elasticity final bounds after the rule (Method Spec 4.4)
applied_bounds:
  bG: [0.6, 2.2]
  bF: [-1.1, -0.3]

# Level 2 pooled panel (Elasticity Design 3)
level2:
  min_cells: 3
  min_obs: 45
  weight_cap_share: 0.40                   # no single airport > 40% of panel weight (P1)

# Level 3 precision weighting (Elasticity Design 4)
level3:
  se_lit: 0.25                             # pseudo-standard error of literature prior (P1)

# Level 3 defaults (Method Spec 4.5 table): MEASURED since 23 August 2026, no longer
# literature priors. John's decision, package B of the architecture measurement
# (MEASUREMENTS 16; scripts/estimate_pooled_panel.py + measure_architecture_package.py).
#
# bG: the mature/emerging split is RETIRED after failing five discriminator tests, the
# last a pooled panel fit over 1,890 country-years with country fixed effects, where
# the group slopes were not significantly different and pointed the wrong way
# (emerging 1.508, mature 1.948). One elasticity per segment: the pooled estimate
# 1.544 (se 0.089, t 17.3) applied as the traffic-weighted world aggregate with the
# former emerging relativities preserved (weights 0.607/0.203/0.191). bG_mature equals
# bG_emerging by construction; the fields stay so nothing downstream breaks, and the
# maturity weight is inert while they are equal.
#
# bF: re-anchored from the prior aggregate -0.66 to the measured -0.292 (se 0.099,
# t -2.95), the world real-fare covariate identified within-country in the same panel,
# relativities preserved. The affordability question is thereby answered by
# measurement, not deferred.
#
# EXPECTED OUTCOME (with the propensity slope 1.422 in the same package): world O&D
# 2060 9,252m, CAGR 2025-2060 2.95%, China 3.08%, comparison position circa 3.7% RPK
# (-0.3 Boeing CMO26, -0.2 Airbus GMF26, +0.1 IATA). REVERSAL: restore
# {1.0/1.5/-0.7, 1.1/1.7/-0.7, 1.3/1.8/-0.5} and slope 1.30; one block, one commit.
# The traffic-weighted alternative level (1.161) was measured and NOT chosen: se 0.142,
# dominated by the two largest country series, lands below the whole published range.
level3_defaults:
  Domestic: {bG_mature: 1.45, bG_emerging: 1.45, bF: -0.309}
  International Short Haul: {bG_mature: 1.643, bG_emerging: 1.643, bF: -0.309}
  Long Haul: {bG_mature: 1.739, bG_emerging: 1.739, bF: -0.221}

# Maturity decay (Method Spec 4.5)
maturity:
  lambda: 0.046                            # 15-year half-life (P1)
  bG_inf: {Domestic: 0.8, International Short Haul: 1.0, Long Haul: 1.1}   # P1
  gdp_per_head_threshold_usd: 25000        # 2025 prices (P1)

# --- Fare index (Method Spec 4.2) ---
fare_index:
  pass_through_theta: 0.9                  # over two years (P1)
  real_yield_trend_tau: -0.003             # -0.3%/yr (P1)

# --- Adjustment overlay (Method Spec 4.6) ---
overlay:
  abs_cap_per_year: 0.10                   # |A| <= 10%/yr (P1)
  fleet_decay_years: [5, 10]
  permitted_codes: [FLEET, SECTOR, POLICY, EVENT, OTHER]

# --- Connecting overlay (Method Spec 5) ---
connecting:
  hub_conx_share_threshold: 0.10           # (P1)
  default_hub_share_factor: 1.0

# --- Capacity and spill (Method Spec 6) ---
capacity:
  peak_spreading_allowance: 1.05           # practical annual = 105% of first-binding level (P1)
  spill_curve:                             # utilisation -> spill fraction (P1), linear interpolation
    - {u: 0.85, sp: 0.00}
    - {u: 0.90, sp: 0.01}
    - {u: 0.95, sp: 0.04}
    - {u: 1.00, sp: 0.10}
  conx_spill_multiple: 1.5                 # connecting spills first at 1.5x pro-rata (P1)

# --- Airport-set scope (Phase 1 roll-out; John's selection rule) ---
# Include an airport if it clears the pax floor OR falls within the top-share set of
# national pax. Below-scope airports in a country collapse into one residual
# pseudo-airport so national totals stay whole. The goal floor is the standing
# ambition (model most airports above it), reported as a gap, not binding in v1.
scope:
  inclusion_floor_pax: 2000000             # include any airport at/above 2m pax/yr [P1 John]
  national_coverage_target: 0.80           # or within the smallest top set making up 80% of national pax [P1 John]
  goal_floor_pax: 500000                   # standing ambition floor; below-goal exclusions reported as a gap [P1 John]
  residual_pseudo_suffix: "_RES"           # residual pseudo-airport code per country

# --- Capacity register K-derivation (Capacity Register - Design and Sourcing v0.1) ---
# The engine's K (annual terminal pax) derives from whichever capacity kind exists.
# Grade A: K = declared_mvts_per_hr x operating_hours x seats_per_mvt x load_factor.
# Grade B: K = design_annual_pax_m directly. Grade C: unconstrained (no K).
capacity_register:
  operating_hours_default: 5840            # 16h x 365, [P1]; a noted curfew overrides per row
  seats_per_mvt_default: 150               # [P1] fallback where the row and segment mix give none
  load_factor_default: 0.82                # [P1] fallback load factor
  ab_reconcile_tol: 0.15                   # [P1] where both A and B exist, flag if derived-A vs design-B differ > 15%
  atfm_delay_flag_min_per_arr: 0.5         # [P1] chronic arrival ATFM delay threshold, minutes/arrival (validation proxy)

# --- Peak hour share (Capacity Method and Evidence Record v0.4, section 11.1) ---
# The share is fitted as a relationship across the schedule panel, not read off one
# year and held flat. Peak-constrained airports are excluded from the estimation
# sample: their filed peak reports the declared parameter, not demand.
peak_hour:
  convention: busy_30th                    # model convention (v0.4 section 10); DDFS supplies the rate
  basis: passengers                        # passenger basis, not movements
  # WINDOW. clock_hour = the 8,760 fixed hours of the year. rolling_60_step_5 = the
  # best 60-minute window starting on any 5-minute boundary, taken once per clock hour.
  # Rolling on a FIVE-minute step is the Avia DEFAULT (John Carter, 4 August 2026),
  # and clients often ask for something else, so this is a per-engagement setting and
  # not a constant. Pass window= to build_panel to override without touching the book.
  # The Zagreb letter of 18 May 2026 specifies "30th busiest hour, rolling".
  # The first version used 10 minutes, taken from how COORDINATORS declare capacity
  # (Nantes and Basel publish "per rolling 60 minutes with a step of 10 minutes").
  # Those are different things: 10 minutes is how a limit is STATED, 5 minutes is how
  # Avia MEASURES demand. rolling_60_step_10 is kept so a declared rate can be tested
  # on the step it was declared on, which is the right comparison against a published
  # coordinator figure. clock_hour is kept because older house work uses it, and
  # because a comparison is only valid against a panel on the same basis.
  # NOTE the divergence from Jess Rowden's panel that this was once thought to explain
  # was a convention mismatch, not a window one. See the withdrawal note below.
  window: rolling_60_step_5
  # WITHDRAWN, 4 August 2026: peak_spreading_bias. It recorded a supposed defect in our
  # peak, circa 8% low at the median and 13% at small airports, blamed on the fact that
  # the store gives one row per operated flight without saying which date it flew.
  # There is no such defect. The comparison behind it was against Jess Rowden's summary,
  # which reports the ABSOLUTE PEAK hour (row 7 of each per-airport Output sheet,
  # LARGE(...,1)) while being headed "30th BHR". We were comparing our 30th busiest
  # against her peak. Confirmed from her BEG workbook on 4 August 2026.
  #
  # Like for like, across her 231 airports, there is no systematic bias at all:
  #     annual movements  -0.4%      annual seats  -0.3%
  #     peak movements    +0.5%      peak seats    -0.4%     median absolute circa 5%
  # Belgrade, compared cell for cell against her own workbook: annual movements -0.5%,
  # annual seats -0.7%, peak movements +2.3%, peak seats +1.3%, and the 30th busiest
  # hour seats agreeing to 0.0%, 4,229 against 4,227.
  #
  # The 5% is scatter, not bias: a single hour out of 8,760 turns on which flights fall
  # inside one clock hour, and two independent builds differ at that level. The lesson
  # is the one that keeps recurring here: establish the other side's convention before
  # attributing a difference to a fault in ours.
  min_annual_pax_m: 0.25                   # [P1] below this the observed peak is erratic
  min_obs_per_airport: 3                   # [P1] airport-years needed to enter the sample
  min_obs_total: 30                        # [P1] below this the fit falls back, flagged
  min_r2: 0.80                             # [P1] below this the level is flagged indicative, not rejected
  # OPERATING CHOICE, settled by the 2025 blind test and RERUN on 4 August 2026 after
  # the Asia 2025 period-overlap fix. Fitted 2015-2019, projected each airport's share
  # to 2025 on its actual traffic growth, scored against the schedules.
  # 2,096 airports, median absolute error:
  #     flat 17.3%   single 14.4%   class 14.2%   curve 14.2%
  #   (before the fix: flat 17.7%   single 15.1%   class 15.1%   curve 15.0%)
  # The fitted elasticity itself did NOT move: the fit years are 2015-2019 and the
  # overlap was in 2025, so the fix corrected the thing being scored, not the
  # parameter. Every method improved by roughly 0.7 of a point.
  # The rule set before the first run was to prefer the simplest method that beats
  # flat, and it still says single: the curve now leads by 0.2 of a point, which is
  # not the clear margin required to justify the harder explanation.
  #
  # WATCH THIS, it is the one thing the rerun changed qualitatively. Above 15m the
  # modelled methods stop earning their keep, and above 40m holding the share flat
  # BEATS them: flat 5.4% against single 6.0%, and flat is within 20% on 100% of
  # those airports. The likely reason is the honest one: the largest airports are at
  # or near a declared ceiling, so their share is pinned by the declaration and does
  # not drift the way the elasticity predicts. That is the population the capacity
  # work is aimed at, so the elasticity is doing least work exactly where the answer
  # matters most. It is not wrong to apply it there, but a constrained airport should
  # be resolved from its declared rate rather than from this projection.
  # n = 37 above 40m, so this is a signal to test, not yet a finding.
  elasticity: 0.696                        # single elasticity, full store, capped airports out
  #
  # RECONCILED against Avia's own prior work, 4 August 2026. There is an in-house fit
  # that predates this engine: "100th Peak Hour Peer Analysis.xlsx" in
  # /Private/nick.oldrini/Work/LAP - LIM/D&A/Peak Hour/. It fits y = c*x^m on the 100th
  # peak hour across a peer set of large airports:
  #     total seats m 0.8036 (R2 0.68)   total ATMs m 0.7618 (R2 0.61)
  #     arriving seats 0.7962   departing seats 0.8318
  #     arriving ATMs  0.7569   departing ATMs  0.7339
  # Its mean, 0.781, sits between our 5m_to_15m (0.754) and 15m_to_40m (0.822) class
  # values, so the peer analysis and our class table AGREE. Both differ materially from
  # the operating single value of 0.696, which is fitted on the full store and is
  # therefore dominated by small airports: 1,401 of the 2,096 backtest airports are
  # under 1m passengers.
  #
  # WHAT THAT COSTS AT A LARGE AIRPORT. Over twenty years at 3% growth:
  #     b 0.696 (operating)   share x0.836   implied annual capacity +19.7%   6.1 extra years
  #     b 0.822 (our 15-40m)  share x0.900   implied annual capacity +11.1%   3.6 extra years
  #     b 0.804 (peer, seats) share x0.890   implied annual capacity +12.3%   3.9 extra years
  # So applying the single value to a large airport buys it roughly 2.4 years of
  # headroom it has not got, and the error is in the OPTIMISTIC direction. On a
  # concession case that is the difference between a terminal inside the term and one
  # outside it.
  #
  # THREE INDEPENDENT LINES POINT THE SAME WAY: the backtest by size (nothing beats
  # holding the share flat above 40m), our own class table (b rises monotonically with
  # size from 0.664 to 0.917), and the peer analysis. All three say the single value
  # over-adjusts at the top end.
  #
  # OPERATING RULE, therefore, until this is reviewed by someone outside the build:
  # the single elasticity STANDS as the default, because the pre-agreed rule was to
  # prefer the simplest method that beats flat and it still does on the full sample.
  # But above circa 15m passengers a projected share must not be the basis of a client
  # binding year where a declared rate exists. Resolve from the register instead. That
  # is what capacity.evidence is for, and it is the honest use of the two together.
  # Reference only, not used by the engine:
  elasticity_by_class:
    under_1m: 0.676
    1m_to_5m: 0.664
    5m_to_15m: 0.754
    15m_to_40m: 0.822
    40m_and_above: 0.917
  # The in-house peer fit, recorded so the two numbers can never drift apart unnoticed
  # again. Source: 100th Peak Hour Peer Analysis.xlsx, Egnyte, /Private/nick.oldrini/
  # Work/LAP - LIM/D&A/Peak Hour/. Different rank (100th, not 30th) and a large-airport
  # peer set, so it is not expected to equal our full-store value; it IS expected to
  # sit near our large-airport class values, and it does.
  elasticity_peer_analysis_100th:
    total_seats: 0.8036
    total_atms: 0.7618
    arriving_seats: 0.7962
    departing_seats: 0.8318
    arriving_atms: 0.7569
    departing_atms: 0.7339
  # Blind-test accuracy of the share projection itself, to be carried into any output
  # that depends on it. Rerun 4 August 2026 after the Asia 2025 overlap fix: median
  # absolute error 14.4%, 37% of airports within 10%, 62% within 20%, on the operating
  # single-elasticity method. A 14% error on the share is a 14% error on the implied
  # annual capacity, which at 3% growth moves a binding year by about 4.5 years. This
  # is the evidence behind reporting a binding-year RANGE rather than a point (Capacity
  # Method v0.4, section 11.3), and it is a stronger reason than the convention
  # argument was.
  share_projection_median_error: 0.144
  fallback_elasticity: 0.696               # same as the operating value
  projection_floor_share: 0.00015          # [P1] floor on projected share over a long horizon
  constrained_utilisation_flag: 0.95       # [P1] filed peak at/above this share of the declared rate = constrained
  capped_growth_ratio: 0.35                # [P1] peak growth below this share of annual growth reads as capped
  capped_static_growth: 0.02               # [P1] growth below this counts as static
  capped_size_floor_mvts: 150000           # [P1] a large airport with a static peak is at its ceiling
  screen_min_mvts: 20000                   # [P1] below this the busy hour is too small to read a trend

# --- Capacity evidence record and resolution (Capacity Method v0.4, sections 2, 5, 11) ---
# Observations are stored as published and never converted in place; the resolution
# layer runs whichever tests the evidence supports and records the ones it could not.
capacity_evidence:
  stand_turnaround_hours: 1.0              # [P1] indicative occupancy for the stand test
  range_trigger_years: 3                   # [P1] binding years further apart than this => report a range
  range_trigger_k_rel: 0.10                # [P1] resolved K differing by more than this => report a range
  actual_over_k_block_rel: 1.00            # [P1] actual traffic above this multiple of K blocks the entry

# --- Aggregation and reconciliation (Method Spec 7) ---
reconciliation:
  residual_share_drift_flag_pp: 3.0        # (P1)
  mirror_flow_tolerance: 0.05              # 5% cell discrepancy (P1)
  parity_tolerance_rel: 0.00001            # 0.001% relative (Method Spec 10)
  watf_country_cagr_explain_pp: 1.0
  global_cagr_band_pp: 0.5

# --- Scenarios (Method Spec 8.1) ---
scenarios:
  Baseline: {gdp_delta_pp: 0.0,  fuel_path: mid,  carbon: scheduled}
  High:     {gdp_delta_pp: 0.5,  fuel_path: low,  carbon: delayed}     # P1
  Low:      {gdp_delta_pp: -0.5, fuel_path: high, carbon: full}        # P1

# --- Coherence tests (Method Spec 8.2) ---
coherence:
  rolling_decade_cagr_max: 0.12
  rolling_decade_cagr_min: -0.03

# --- Backtest (Method Spec 9) ---
backtest:
  fit_window: [2000, 2019]
  forecast_window: [2022, 2026]
  naive_gdp_multiple: 1.5
  acceptance_regions_min: 6                 # of 8
  acceptance_bias_abs: 0.02

# --- Pipeline adjudication, Fable Tier 1 (5 July 2026); amends Method Spec 5.2/6.2/6.4/7.4 ---
pipeline:
  passes: 2                                # two-pass; no fixed point in v1 (Q1)
  connecting_regrow_escalate_pct: 0.02     # T-E: escalate to damped iteration if per-hub gap > 2% of terminal [P1]
  both_ends_vs_capreq_tol: 0.02            # Q2: flow-level suppression vs airport CapReq within 2% [P1]
  max_connections_modelled: 1              # v1 models at most one connection per itinerary (Q3 scope)
  default_final_to_next: sabre_gdd         # Q4: GDD-derived M per airport; nonstop-service fallback; identity only own-region/domestic

# --- Final-to-next mapping M (Method Spec 5.4; Fable Q4, amends the identity default) ---
final_to_next:
  default_source: sabre_gdd                 # GDD itineraries with connect points (Work Order 4.b)
  nonstop_diagonal_share: 0.7               # [P1] direct share where a has nonstop service to region r
  # else remainder routed via the designated hub for the (origin country, region) pair;
  # 100% via hub where no nonstop service; identity only for own-region short-haul and domestic.
  TF_offdiag_vs_conx_tol: 0.10              # [P1] T-F: implied one-connection journeys vs base-year CONX

# --- Redistribution headroom threshold (Method Spec 6.3; Fable Q6 amends Part 1) ---
capacity_redistribution:
  spill_start_threshold: 0.85               # theta [P1] headroom measured to theta*K, not K (no re-spill cascade)

# --- Parameter homes closed from the input-contract audit (Fable, 5 July) ---
# Already homed elsewhere in this book: peak-spreading 1.05 (capacity), ND diagonal 0.7
# and TF tol 0.10 (final_to_next), T-E 2% (pipeline), spill-start theta (capacity_redistribution).
deflators:                                  # H1: CPI deflation convention (Elasticity Design 1)
  source: "IMF CPI"
  outbound_domestic: home_cpi               # fares/GDP deflated by home-market CPI
  inbound: destination_region_cpi_composite # inbound deflated by destination-region CPI composite
saf:
  lifecycle_credit_factor: 0.8              # H2: was a formula literal (OUT-24)
constructed_series:                         # H7: fare-history construction recipe (G1), pending John/Jess
  fare_history_recipe: pending_confirmation # [P1] see CHANGELOG G1: DB1B(NA full) + GDD levels 2020-25 + cost-driven backcast pre-2020 calibrated to the 2020-25 overlap; UK cross-check vs CAA

# --- Fare-elasticity strategy (Fable Part B, 5 July; amends Method Spec 4.2a/4.3/4.4/9) ---
fare_strategy:
  applied_level: segment                    # bF is segment-level (L2/L3), never airport L1
  restricted_level1: true                   # L1 estimates bG on the fare-adjusted series; bF fixed at segment
  estimation_series: counterfactual_in_anomaly_years   # F5: cost-model fares for 2020-24, observed from 2025
  identification_weights:                    # which fuel episodes carry bF identification
    primary: [2014, 2015, 2016]             # clean oil collapse, stable demand
    supporting: [2011, 2012, 2013]
    conditional_on_gfc_dummy: [2008, 2009]
  gds_use: changes_not_levels               # GDS fares used for changes; levels (F15) from DB1B/CAA/GDD
  vfare_tolerance: 0.15                      # [P1] US two-method agreement (DB1B vs cost-driven)
  recipe: "DB1B NA full depth; cost-driven 2000-2019 calibrated to 2014-2019 observed; cost-driven counterfactual 2020-2024; observed/GDD from 2025"

# --- Propensity-to-fly maturity (Cockpit build update B1; replaces Method Spec 4.5 decay) ---
propensity:
  region_asymptote_trips_pc:            # saturation ceiling (trips per capita), region defaults [P1]
    default: 3.0
    "EU+UK": 3.2
    "North America": 3.5
    "Asia Pacific": 2.6
    "Middle East": 3.0
    "Africa": 2.2
    "South America": 2.6
    "Other Europe": 3.0
    Domestic: 3.2
  terminal_tpc_growth: 0.007           # mature floor: growth slows to ~0.7%/yr, never stops (no hard ceiling) [P1 John]
  income_elasticity_tpc: 1.422         # FITTED world-curve slope, re-fitted 23 August 2026 on
                                       # 191 countries (visitor economies excluded by name), the
                                       # population it is applied to; the 30-country control
                                       # reproduces the previous 1.30 at 1.296
                                       # (scripts/measure_propensity_refit.py). Applied as part
                                       # of package B, MEASUREMENTS 16.

# --- Segment output splits (Cockpit build update B2) ---
segment_splits:
  domestic_excess_factor: 0.55        # domestic keeps 55% of international excess growth [P1]
  floor_rate: 0.0                     # common growth floor both segments share [P1]

# --- Cargo, GA and ATMs (Cockpit build update E1/E2) ---
cargo:
  gdp_elasticity: 1.0                 # cargo tonnage growth per unit GDP growth [P1]
  belly_share: 0.5                    # share of cargo carried in pax belly (rides in pax ATMs) [P1]
  tonnes_per_freighter_atm: 80.0      # freighter payload per ATM [P1]
general_aviation:
  atm_share_note: "GA pax and GA ATMs carry their own growth (analyst input)"
design_day:
  fraction_of_annual_atm: 0.004       # design-day movements as a share of annual ATMs [P1]

# --- BUM: 2-year bottom-up model (Cockpit build update C) ---
bum:
  weeks_per_year: 52
  blend_years_default: 3              # taper BUM-implied growth to the model path over N years
  reconcile_wide_gap_pct: 0.05        # warn if QSI adds move the total more than this vs model [P1]
  base_year_reason_codes: [SCHED-GAP, LF-REVISION, LAUNCH, WITHDRAWAL]

# --- ATM conversion and cargo/GA bases for the derive layer (Cockpit E wiring) ---
atm_conversion:
  seats_per_movement: {Domestic: 150, "International Short Haul": 180, "Long Haul": 280}   # [P1]
  load_factor: {Domestic: 0.80, "International Short Haul": 0.82, "Long Haul": 0.84}        # [P1]
cargo_base:
  tonnage_kt: 1500.0                  # base-year cargo, thousand tonnes (illustrative pending register)
general_aviation_base:
  pax_m: 0.3
  atm_k: 20.0
  growth: 0.02

# --- Population driver (Cockpit B1 propensity) ---
# Base-year population (real): build/data/worldbank_pop_gdppc.json (World Bank = UN Pop Division,
# SP.POP.TOTL 2024). Horizon growth: UN WPP 2024 medium-variant regional averages to 2050 [P1]
# (the UN dataportalapi and the World Bank projection source did not serve programmatically in the
# sandbox; John can export the WPP2024 medium-variant CSV to the project folder for the exact series).
population:
  base_source: "worldbank_pop_gdppc.json (WB SP.POP.TOTL 2024 = UN Pop Division)"
  horizon_source: "un_wpp_population.json (UN WPP 2024 medium variant, 1 July, 2024-2050, per-country exact)"
  growth_by_region:                   # UN WPP 2024 medium variant, avg annual to 2050 [P1]
    Domestic: 0.003
    "EU+UK": 0.001
    "Other Europe": 0.000
    "Africa": 0.021
    "Middle East": 0.011
    "Asia Pacific": 0.004
    "North America": 0.004
    "South America": 0.004

# --- Global drivers (Phase 3 multi-country run) ---
# Regional long-run real GDP growth [P1], applied to every airport by its country's
# region (outbound demand uses home-market GDP, Method Spec 4.1). Per-country OEF
# overrides (Jul 2024 world file on Egnyte) replace these where staged. Maturity of
# the elasticity is set by country GDP per head where known, else by region default.
global_drivers:
  # How an airport's connecting share is set where Sabre leg-measured and ACI-residual
  # disagree: geometric blend of the two. Was a code default only until 23 August 2026;
  # a switch absent from the book reads as though it does not exist.
  connecting_share_method: blend
  # The publication watchpoint band: the build STOPS when airports whose two connecting
  # sources disagree by more than 30 points hold more than this share of world terminal
  # traffic. Raised from 0.10 to 0.12 on 23 August 2026 as an interim, recorded here
  # deliberately: the current build measures 0.1087, the terminal LEVEL of every flagged
  # airport is ACI-anchored regardless (only the split between the O&D-driven and
  # connecting-driven growth paths is uncertain), and the size of that effect on
  # published totals was measured on 23 August 2026 (scripts/measure_connecting_divergence.py):
  # applying every airport's Sabre share against its ACI-residual share moves world 2060
  # terminal by 816m, 3.12% of the blended figure, and the CAGR by 0.09pp (2.935% to
  # 3.027% around the blend's 2.962%). That bounds the METHOD choice across all airports,
  # so the flagged set alone contributes less; the band stands with this bound recorded.
  # Noted follow-up from the same run: the largest absolute spreads are at hubs BELOW the
  # 30-point flag (BLR 101m on a 843m level, DEL 67m, SVO 26m on 88m), so a second caveat
  # dimension keyed on absolute spread is the improvement, not a tighter band. Tighten to
  # 0.10 or below once the flagged set is reconciled; never raise without a measurement.
  connecting_flag_band: 0.12
  gdp_growth_by_region:
    "EU+UK": 0.015
    "Other Europe": 0.021
    "North America": 0.019
    "South America": 0.024
    "Africa": 0.040
    "Middle East": 0.030
    "Asia Pacific": 0.037
  # How mature a market is treated as being, which decides whether it takes the mature or
  # the emerging income elasticity from level3_defaults. Added to the book 9 August 2026;
  # until then the income threshold below was the only basis and it was a cliff.
  #
  #   income_threshold  at or above maturity_gdppc_threshold_usd, fully mature; below it,
  #                     fully emerging. Nothing in between.
  #   saturation        maturity is how far up its own propensity curve a country already
  #                     is, trips per capita against the regional asymptote, so the
  #                     elasticity interpolates and there is no cliff.
  #
  # Measured 9 August 2026: on the income threshold China took the mature domestic
  # elasticity of 1.0 at 29,333 international dollars per head and 0.4 trips per capita,
  # and half of China's traffic ran on it. Moving to saturation takes the world CAGR
  # 2025-2060 from 2.89% to 3.05% and China from 2.61% to 3.13%. See MEASUREMENTS.md
  # section 8. John, 9 August 2026.
  #
  # THE OPEN OBJECTION, recorded here rather than in a reviewer's mouth. Saturation also
  # drives the propensity headroom that damps growth above the mature floor, so maturity
  # is now monotone in the same quantity twice. The two do different jobs, one setting how
  # strongly demand answers income and the other how much of the excess is retained, but
  # the combined effect is second order in saturation and that has not been measured.
  # Owner: John. The alternative, if it does not survive the measurement, is to drop the
  # mature and emerging split and let the headroom read maturity alone.
  #
  # DECIDED 23 August 2026 (John): headroom_only, which is exactly that alternative,
  # case C of the four-case measurement in the independent review. The double-count
  # objection was measured on 16 August: the saturation basis damped growth through the
  # elasticity split AND the headroom, an interaction of -0.12pp world / -0.20pp China,
  # second order and conservative. headroom_only removes the split so saturation damps
  # once; every country takes the emerging elasticity and od_recursion_damped matures it.
  # EXPECTED OUTCOME of the rebuild, from that measurement: world O&D CAGR 2025-2060
  # circa 3.16% (from 3.05%) and China circa 3.29% (from 3.18%). This is a decision to
  # see the outcome: if the rebuild lands materially away from those figures, REVERSE by
  # setting this back to `saturation`, which reproduces the 9-22 August forecasts and is
  # kept as the control, as `income_threshold` is for the pre-9-August ones.
  #
  # REVERSED, same day (John, 23 August 2026, evening). The mechanism landed exactly as
  # measured (3.16% verified), but the comparison run on the new basis put world RPK
  # 2024-2044 at 4.0%: equal to the Boeing CMO 2026, 0.1pp ABOVE the Airbus GMF 2026 and
  # 0.4pp above IATA on the same Oxford Economics drivers, past the top of the band the
  # review of 16 August defends ("inside the published range, at the top of the half
  # that shares our drivers"). John's stated comfort is closer to IATA and Airbus, so
  # saturation returns and world RPK returns to 3.8% (-0.2 vs CMO 2026, -0.1 vs GMF,
  # +0.2 vs IATA). The case C measurement stands in the review and CHANGELOG; revisit in
  # September TOGETHER with the propensity re-fit (candidate slope 1.422, measured
  # -0.04pp world, scripts/measure_propensity_refit.py) and the income join, because the
  # split decision and the curve slope pull opposite ways and belong in one weighing.
  #
  # THE ARCHITECTURE, SETTLED FOR NOW ON THE EVIDENCE OF 23 AUGUST 2026 (MEASUREMENTS
  # 15). The split's discriminator was tested four ways and supported by none: fitted
  # country elasticities against income (CHANGELOG 119, R2 0.057) and against
  # saturation (slope +0.06, t 0.4) on the terminal-based fits, and both again on the
  # clean O&D-based re-estimation (income t 1.40, saturation t 1.19). The split is
  # therefore a stated judgement, not a measured one. It stays anyway, because no
  # evidenced replacement exists: the O&D fits are clean where they converge (zero of
  # 42 reliable at any bound, against a third of the terminal set) but underpowered on
  # ten observations, so the heavyweights fail reliability (China, Japan, Germany,
  # Brazil, Mexico among them) and the reliable subsample is small markets, whose
  # traffic-weighted level (1.794) would over-impose emerging response on mature
  # markets - the harm the split guards against. External coherence holds the applied
  # configuration: world RPK 3.8% for 2024-2044, 0.2 above IATA on shared drivers,
  # behind both OEMs (MEASUREMENTS 11). The instrument that can settle level and split
  # together is a POOLED panel fit with country effects over the O&D window, or the
  # affordability-conditioned estimation once the fare levels join the income paths:
  # September, with data/estimated_bG_by_country_od.json as the starting point.
  #
  # RESOLVED the same night: the pooled panel fit ran (MEASUREMENTS 16), the split
  # failed its fifth test and retired via package B, and level3_defaults now sets
  # bG_mature equal to bG_emerging per segment, which makes this basis INERT for the
  # elasticity; the propensity headroom still reads saturation, once, as intended.
  # The setting stays as documentation and for reversal.
  maturity_basis: saturation
  maturity_gdppc_threshold_usd: 25000      # >= this (PPP) => mature elasticity [P1]
  mature_regions_default: ["EU+UK", "North America"]   # maturity fallback where country GDPpc unknown

  # --- Elasticity application. Added to the book 9 August 2026. All three were code
  # defaults in global_demand.py and appeared in no configuration file, so three numbers
  # that move the world forecast could only be found by reading Python, against the
  # design rule of configuration not code (Data Architecture 5.2). The values here are
  # exactly the code defaults they replace: nothing moves by adding them.
  use_estimated_elasticities: false
  # OFF. estimated_bG_by_country.json holds 137 reliable country fits and they are loaded
  # on every run and discarded while this is false. Turning it on applies a country's own
  # estimated income elasticity in place of the maturity default. The test that would let
  # it be turned on: a review of the country fits, and the world and regional effect
  # measured with the switch on and off (see MEASUREMENTS.md, 9 August 2026). Owner: John.

  use_airport_elasticities: true
  # ON. Applies an airport's OWN fitted elasticity where it is reliable and its connecting
  # share is at or below airport_elasticity_max_cx. 111 airports carry a reliable own fit.

  airport_elasticity_max_cx: 0.25
  # The connecting-share screen. An airport above it falls back to its country value,
  # because a terminal-panel fit at a hub measures hub development rather than O&D income
  # response. 68 of the 111 sit above it. This screen is 2.1 points of the 12.2% forecast
  # correction of 8 August 2026, so it is not a minor parameter. [P1] pending the O&D
  # re-estimation, which is what would let the hubs keep their own fits.

# --- Rated-terminal overrun (steer doc 7 Aug 2026; PROVISIONAL until the capacity
# workstream supersedes the parameters). A rated terminal level is a service-level
# line, not a wall: airports operate above it (NTE, BSL) at a service cost. K is
# never floored at throughput; spill applies only to growth above the observed base
# level, at a soft share. No hard cap is applied where none is held.
capacity_overrun:
  soft_spill_share: 0.30          # share of demand above the observed base that spills [PROVISIONAL]
  hard_cap_default: none_held     # explicit: no invented hard caps
  provisional: true               # capacity workstream's parameters supersede on arrival
