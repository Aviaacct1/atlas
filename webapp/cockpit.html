<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Avia Analyst Cockpit - Internal Mockup v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--navy:#1F3B57;--navy2:#2c5378;--gold:#C9A227;--teal:#1d7a6e;--bg:#f4f6f8;--card:#ffffff;--line:#d7dde3;--txt:#1c2733;--mut:#5c6b7a;--red:#b3452b;--green:#2e7d4f;--proj:#7a3b8f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:var(--navy);color:#fff;padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .brand b{font-size:16px} header .brand span{opacity:.75;font-size:11.5px;display:block}
.internal{background:var(--gold);color:#20293a;font-weight:700;font-size:11px;padding:3px 10px;border-radius:10px;letter-spacing:.5px}
.mtab{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:5px 14px;border-radius:16px;cursor:pointer;font-size:12.5px}
.mtab.on{background:var(--gold);border-color:var(--gold);color:#20293a;font-weight:600}
.mtab.bes.on{background:var(--teal);border-color:var(--teal);color:#fff}
.spacer{flex:1}
main{max-width:1200px;margin:18px auto;padding:0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h3{font-size:13px;color:var(--navy);margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1.6fr;gap:14px;align-items:start}
.modewrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
.modecard{background:#fff;border:2px solid var(--line);border-radius:14px;padding:22px;cursor:pointer;transition:border-color .15s}
.modecard:hover{border-color:var(--gold)} .modecard.bes:hover{border-color:var(--teal)}
.modecard h2{font-size:17px;color:var(--navy);margin-bottom:8px}
.modecard p{font-size:13px;color:var(--mut);line-height:1.5;margin-bottom:10px}
.modecard .who{font-size:11.5px;color:var(--navy2);font-weight:600}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:9px;margin:2px 3px 2px 0;font-weight:600}
.pill.pub{background:#e2efda;color:var(--green)} .pill.prj{background:#f0e3f7;color:var(--proj)}
.pill.gold{background:#fbf0d5;color:#8a6d00} .pill.grey{background:#e8edf2;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--navy);color:#fff;text-align:left;padding:6px 8px;font-weight:600;font-size:11.5px}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.xl{border:1px solid #b7bec6;font-size:12.5px}
.xl td{border:1px solid #d0d7de;padding:5px 8px;background:#f2f4f6;color:#444}
.xl td.hd{background:#e4e9ee;font-weight:600;color:var(--navy)}
.xl td.ed{background:#FFF2CC;color:#0000CC;font-weight:600;cursor:pointer;text-align:right}
.xl td.ed:hover{outline:2px solid var(--gold)}
.xl td.was{color:var(--mut);font-size:11px;text-align:right;background:#f2f4f6}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:13px}
.btn.run{background:var(--gold);color:#20293a} .btn.tealb{background:var(--teal);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.btn.promote{background:#fff;border:2px solid var(--red);color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.runstrip{display:flex;gap:16px;font-size:11.5px;color:var(--mut);flex-wrap:wrap;margin-top:8px}
.runstrip b{color:var(--navy)}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:10px 12px}
.kpi .v{font-size:19px;font-weight:700;color:var(--navy)} .kpi .l{font-size:11.5px;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.pos{color:var(--green)} .neg{color:var(--red)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mut);margin-top:4px;flex-wrap:wrap}
.sw{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:4px;border-radius:2px}
.lvl{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.lvl button{padding:4px 12px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px;color:var(--navy)}
.lvl button.on{background:var(--navy);color:#fff}
.lvl button.teal.on{background:var(--teal)}
.wall{background:linear-gradient(90deg,#f0e3f7 0 60%,#e2efda 60%);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:12px;display:flex;align-items:center;gap:12px;margin-bottom:12px}
.wall .bar{width:6px;align-self:stretch;background:var(--red);border-radius:3px}
.note{background:#fbf6e8;border-left:4px solid var(--gold);padding:9px 11px;font-size:12px;border-radius:6px;margin-top:8px;color:#4c4632}
.check{font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between}
.mut{color:var(--mut)} .footer{margin:26px 0 14px;font-size:11px;color:var(--mut);text-align:center}
.wf{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.inrow{display:grid;grid-template-columns:1.4fr .7fr .8fr .8fr;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.inrow input{width:100%;padding:4px 6px;border:1px solid var(--gold);background:#FFF2CC;border-radius:5px;font-weight:600;color:#0000CC;text-align:right;font-size:12.5px}
.inrow .def{text-align:right;color:var(--mut)}
.ingrp{margin-bottom:14px}
.ingrp h4{font-size:12px;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:3px;margin-bottom:4px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.gcard{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 12px 8px;cursor:pointer;font-family:Arial,Ebrima,sans-serif}
.gcard:hover{outline:2px solid var(--gold)}
.gcard h4{font-size:12.5px;color:#000;font-weight:700;text-align:center;margin-bottom:1px;font-family:Arial,sans-serif}
.gcard .src{font-size:10px;color:#404040;text-align:center;margin-bottom:4px}
.gcard .leg{display:flex;gap:12px;justify-content:center;font-size:9.5px;color:#404040;margin-top:2px;flex-wrap:wrap}
.gcard .leg .sw{width:11px;height:8px;border-radius:1px}
.gsec{font-size:12px;color:var(--navy);border-bottom:2px solid var(--gold);padding-bottom:3px;margin:16px 0 10px;font-weight:700}
.gsec:first-of-type{margin-top:4px}
.gcard.wide{grid-column:1/-1}
.search{padding:8px 12px;border:1px solid var(--line);border-radius:8px;width:340px;font-size:13.5px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.modewrap{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <div class="brand"><b>Avia Forecast Cockpit</b><span>Analyst tool - same engine as the product, edit-run-compare surface</span></div>
  <span class="internal">INTERNAL</span>
  <div class="spacer"></div>
  <button class="mtab" id="t-pick" onclick="setMode('pick')">Modes</button>
  <button class="mtab" id="t-sb" onclick="setMode('sb')">Global sandbox</button>
  <button class="mtab bes" id="t-bc" onclick="setMode('bc')">Bespoke client</button>
</header>
<main id="main"></main>
<script>
"use strict";
// ===== VINTAGE CLOCK: one dial rolls the whole tool forward each year =====
const BY=2025;                       // vintage base year - change this and every year, label, window and scenario moves
const H0=BY-6, HZ=BY+35;             // history start, forecast horizon (BY+35: lessors need 30 years, DfT publishes to 2060 - Jess)
const VN="v"+(BY+1)+".2", VNn="v"+(BY+1)+".3"; // vintage names
const YRS=[];for(let y=H0;y<=HZ;y++)YRS.push(y);
const iY=y=>YRS.indexOf(y);
const SPOTS=[BY,BY+5,BY+10,BY+15,BY+20,BY+25,BY+30,BY+35]; // spot years run to the horizon end (Jess: CAGRs stopped short)
const yl=y=>y+(y<=BY?"A":"F");
const yy=y=>"'"+String(y).slice(2);
const COVID={2020:.45,2021:.55,2022:.8,2023:.92,2024:.98}; // calendar-anchored history events, deliberately NOT offset
const KGROW=y=>Math.pow(1.005,Math.max(0,y-(BY+2)));
const pct=v=>(v*100).toFixed(1)+"%";
function fmM(v){const a=Math.abs(v),sg=v<0?"-":"";if(a>=1)return sg+a.toFixed(a>=10?0:1)+"m";if(a>=0.0005)return sg+Math.round(a*1000)+"k";return "0";}
let CK=null, CKBYI={}, CKCAND=null;
let QSIPOLL=0, QSISAW=false;   // active-poll deadline + 'saw a run start' latch
const MAX_CX=0.25;   // airport-own elasticity applies only below this connecting share (matches the book)
function regGe(r){return r==="Europe"?1.15:r==="Middle East"?1.35:r==="North America"?1.3:1.45;}
function tpcOf(r){return r==="Europe"?2.5:r==="Middle East"?3.0:r==="North America"?3.2:r==="Asia Pacific"?1.0:1.6;}
function mixOf(a){const lh=a.reg==="Europe"?0.18:a.reg==="Middle East"?0.55:a.reg==="North America"?0.25:0.30;
  const nd=1-a.dom;return [a.dom, nd*(1-lh), nd*lh];}
function engineBaseSeries(code,scen){const a=CKBYI[code];return a?(a.series[scen||"Baseline"]||a.series.Baseline).slice():null;}
function engineEntitySeries(e){if(!CK)return null;let k=null;
  if(e[1]==="global")k="Global"; else if(e[1]==="region")k="reg:"+e[0]; else if(e[1]==="country")k="cty:"+e[0];
  else if(e[1]==="airport"){const code=e[0].split(" ").pop();return engineBaseSeries(code,"Baseline");}
  const ent=CK.entities[k];return ent?ent.Baseline.slice():null;}
function applyDelta(base,gAdjFn){const out=[];let fac=1;
  for(let i=0;i<YRS.length;i++){const y=YRS[i];if(y>BY)fac*=(1+(gAdjFn?gAdjFn(y):0));out.push(base[i]*fac);}return out;}
function buildENT(){const e=[["Global","global",0,0,0,"",""]];
  CK.regions.forEach(r=>e.push([r,"region",0,0,0,"",""]));
  (CK.countries||[]).slice(0,8).forEach(c=>{const reg=(CK.airports.find(a=>a.cty===c)||{}).reg||"";e.push([c,"country",0,0,0,"",reg]);});
  ["DEL","LHR","LGW","DXB","JFK"].forEach(code=>{const a=CKBYI[code];if(a)e.push([a.n+" "+code,"airport",a.base,a.g,a.cap||0,a.cty,a.reg]);});
  return e;}
function constrain(u,capFn,spMax,theta=0.85){const c=[];
  YRS.forEach((y,i)=>{const K=capFn(y);
    if(K>0){const ut=u[i]/K;
      let s=ut<=theta?0:Math.min(Math.pow((ut-theta)/(1-theta),2)*spMax+Math.max(ut-1,0)*0.5,Math.max(1-K/u[i],spMax));
      c.push(Math.min(u[i]*(1-s),K));}else c.push(u[i]);});return c;}
function mkU(base,g,gAdj){
  const u=YRS.map(y=>y<=BY?base*Math.pow(1+g,y-BY)*(COVID[y]||1):null);
  for(let i=0;i<YRS.length;i++){const y=YRS[i];if(y>BY)u[i]=u[i-1]*(1+g+(gAdj?gAdj(y):0));}
  return u;}
// ================= GLOBAL SANDBOX (unchanged design) =================
let ENT=[["Global","global",680,.034,0,"",""],
 ["Asia Pacific","region",255,.049,0,"",""],["Europe","region",180,.024,0,"",""],
 ["North America","region",140,.021,0,"",""],["Middle East","region",55,.045,0,"",""],
 ["India","country",62,.064,0,"","Asia Pacific"],["China","country",118,.052,0,"","Asia Pacific"],
 ["United Kingdom","country",71,.021,0,"","Europe"],["Italy","country",44,.023,0,"","Europe"],
 ["Delhi DEL","airport",25.9,.062,31,"India","Asia Pacific"],
 ["Heathrow LHR","airport",26.9,.018,29.3,"United Kingdom","Europe"],
 ["Gatwick LGW","airport",15.5,.02,16,"United Kingdom","Europe"],
 ["Genoa GOA","airport",1.62,.034,2.0,"Italy","Europe"],
 ["Dubai DXB","airport",30.8,.04,39,"UAE","Middle East"]];
const PARAMS=[
 {id:"tau",name:"Real fare trend tau (%/yr)",vintage:-0.30,step:-0.10,min:-0.60,max:0.00,sec:"Fares (Method Spec 4.2)"},
 {id:"gdpIN",name:"India long-run GDP (%/yr)",vintage:6.6,step:0.2,min:5.8,max:7.4,sec:"GDP paths (assumptions book)"},
 {id:"sp100",name:"Spill at 100% utilisation (%)",vintage:10,step:2,min:6,max:16,sec:"Capacity (Method Spec 6.2)"}];
let ED={tau:-0.30,gdpIN:6.6,sp100:10};
let RAN=false, LVL="airport";
function gAdjFor(e){return y=>{if(y<=BY)return 0;
  let d=-0.6*(ED.tau-(-0.30))/100;
  if(e[5]==="India"||e[0]==="India")d+=1.3*(ED.gdpIN-6.6)/100;
  if(e[1]==="region"&&e[0]==="Asia Pacific")d+=1.3*(ED.gdpIN-6.6)/100*0.35;
  if(e[1]==="global")d+=1.3*(ED.gdpIN-6.6)/100*0.13;
  return d;};}
function sbSeries(e,edited){
  const base=engineEntitySeries(e);
  const u = base ? (edited?applyDelta(base,gAdjFor(e)):base.slice())
                 : mkU(e[2],e[3],edited?gAdjFor(e):null);   // fallback to synthetic if entity not in engine bundle
  return {u,c:constrain(u,y=>e[4]*KGROW(y),edited?ED.sp100/100:0.1)};}
const editedList=()=>PARAMS.filter(p=>Math.abs(ED[p.id]-p.vintage)>1e-9);
function hash(){return "pk-"+btoa(JSON.stringify(ED)).slice(0,8).toLowerCase();}
function bigChart(b,n){
  const W=640,H=250,P=44;const mx=Math.max(...b.u,...(n?n.u:[0]))*1.06;
  const X=i=>P+(W-P-10)*(i/(YRS.length-1)),Y=v=>H-26-(H-46)*(v/mx);
  const path=a=>a.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
  const yT=[0,.25,.5,.75,1].map(t=>{const v=mx*t;return `<line x1="${P}" y1="${Y(v)}" x2="${W-10}" y2="${Y(v)}" stroke="#e3e8ee"/><text x="${P-5}" y="${Y(v)+4}" font-size="10" fill="#8a97a5" text-anchor="end">${v>=1000?(v/1000).toFixed(1)+"bn":Math.round(v)}</text>`;}).join("");
  const xT=YRS.filter(y=>y%5===0).map(y=>`<text x="${X(iY(y))}" y="${H-8}" font-size="10" fill="#8a97a5" text-anchor="middle">${y}</text>`).join("");
  const nl=n?`<path d="${path(n.u)}" fill="none" stroke="#1d7a6e" stroke-width="2" stroke-dasharray="7 4"/><path d="${path(n.c)}" fill="none" stroke="#7a3b8f" stroke-width="2" stroke-dasharray="7 4"/>`:"";
  return `<svg viewBox="0 0 ${W} ${H+16}" style="width:100%"><text transform="translate(12,${(H-10)/2}) rotate(-90)" font-size="10.5" fill="#5f7185" text-anchor="middle">Passengers (m)</text><text x="${(P+W-10)/2}" y="${H+9}" font-size="10.5" fill="#5f7185" text-anchor="middle">Year</text>${yT}
   <line x1="${X(iY(BY))}" y1="14" x2="${X(iY(BY))}" y2="${H-26}" stroke="#b9c2cc" stroke-dasharray="3 4"/>
   <path d="${path(b.u)}" fill="none" stroke="#2c5378" stroke-width="2.2"/>
   <path d="${path(b.c)}" fill="none" stroke="#C9A227" stroke-width="2.2"/>${nl}${xT}</svg>
   <div class="legend"><span><span class="sw" style="background:#2c5378"></span>Base unconstrained</span><span><span class="sw" style="background:#C9A227"></span>Base constrained</span>${n?'<span><span class="sw" style="background:#1d7a6e"></span>Run unconstrained</span><span><span class="sw" style="background:#7a3b8f"></span>Run constrained</span>':""}</div>`;}
function renderPick(){
  document.getElementById("main").innerHTML=`
  <div class="modewrap">
   <div class="modecard" onclick="setMode('sb')">
    <h2>Global sandbox</h2>
    <p>Refine the GLOBAL forecast. Edit shared assumptions, run against the current vintage, see the whole-model impact airport to global. Changes reach the product only via the governed promote step.</p>
    <span class="pill pub">public data only</span><span class="pill gold">edits: assumptions book</span><span class="pill grey">can promote (governed)</span>
    <p class="who" style="margin-top:10px">Jess + team, when a product change is judged warranted</p>
   </div>
   <div class="modecard bes" onclick="setMode('bc')">
    <h2>Bespoke client forecast</h2>
    <p>Type an airport, generate instantly from the engine's data, then tailor every input and layer client data. All Avia-template charts generated from the outputs; deliverable is the full Excel model. Nothing here can enter the global tool.</p>
    <span class="pill prj">project namespace</span><span class="pill gold">every input visible &amp; editable</span><span class="pill grey">full chart gallery + full Excel model out</span>
    <p class="who" style="margin-top:10px">Jess or Nick, per engagement - inherits the engine's long-run calibration automatically</p>
   </div>
  </div>
  <div class="note" style="max-width:900px;margin:18px auto">Two purposes, one engine. Editing happens in this front end; every edit auto-serialises to the override pack (the hashable source of truth). Excel is the OUTPUT: the full completed model. All figures synthetic.</div>
  <div class="footer">Avia Solutions - internal cockpit mockup v2. Companion to the customer Dashboard Mockup; same engine, different surface.</div>`;}
function renderSB(){
  const edits=editedList();
  const rows=PARAMS.map(p=>{const cur=ED[p.id];const chg=Math.abs(cur-p.vintage)>1e-9;
    return `<tr><td class="hd">${p.name}<div class="mut" style="font-size:10.5px;font-weight:400">${p.sec}</div></td>
     <td class="was">vintage: ${p.vintage}</td>
     <td class="ed" onclick="cycle('${p.id}')">${cur.toFixed(p.id==='sp100'?0:p.id==='gdpIN'?1:2)}${chg?' &#9998;':''}</td></tr>`;}).join("");
  const world=ENT.map(e=>({e,b:sbSeries(e,false),n:RAN?sbSeries(e,true):null}));
  const G=world[0];const i45=iY(BY+20);
  let kpis="",movers="";
  if(RAN&&G.n){
    const dU=G.n.u[i45]-G.b.u[i45],dC=G.n.c[i45]-G.b.c[i45];
    const capB=G.b.u[i45]-G.b.c[i45],capN=G.n.u[i45]-G.n.c[i45];
    const cls=v=>v>=0?"pos":"neg",sg=v=>(v>=0?"+":"")+v.toFixed(1);
    kpis=`<div class="kpis">
     <div class="kpi"><div class="v ${cls(dU)}">${sg(dU)}m</div><div class="l">Global unconstrained ${BY+20} &#916;</div></div>
     <div class="kpi"><div class="v ${cls(dC)}">${sg(dC)}m</div><div class="l">Global constrained ${BY+20} &#916;</div></div>
     <div class="kpi"><div class="v ${cls(capN-capB)}">${sg(capN-capB)}m</div><div class="l">Capacity requirement ${BY+20} &#916;</div></div>
     <div class="kpi"><div class="v">${edits.length}</div><div class="l">parameters edited</div></div></div>`;
    const lv=world.filter(w=>w.e[1]===LVL);
    const mr=lv.map(w=>{const d=w.n.c[i45]-w.b.c[i45];const du=w.n.u[i45]-w.b.u[i45];
      return {n:w.e[0],d,du,pc:d/Math.max(w.b.c[i45],.01)};}).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
    movers=`<div class="card"><h3>Movers by |&#916;| - the vintage bridge (run-to-run change attribution)</h3>
     <div class="lvl">${["global","region","country","airport"].map(l=>`<button class="${LVL===l?'on':''}" onclick="LVL='${l}';renderSB()">${l[0].toUpperCase()+l.slice(1)}</button>`).join("")}</div>
     <table><tr><th>Entity</th><th class="num">&#916; unconstrained ${BY+20}</th><th class="num">&#916; constrained ${BY+20}</th><th class="num">&#916;%</th><th>Attributed to</th></tr>
     ${mr.map(m=>`<tr><td>${m.n}</td><td class="num ${m.du>=0?'pos':'neg'}">${(m.du>=0?"+":"")+m.du.toFixed(2)}m</td><td class="num ${m.d>=0?'pos':'neg'}">${(m.d>=0?"+":"")+m.d.toFixed(2)}m</td><td class="num">${pct(m.pc)}</td><td class="mut">${edits.map(e=>e.name.split(" (")[0]).join(" + ")||"-"}</td></tr>`).join("")}</table></div>`;}
  document.getElementById("main").innerHTML=`
  <div class="grid2">
   <div class="card"><h3>Assumptions (edit here - auto-serialised to the override pack)</h3>
    <table class="xl">${rows}</table>
    <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
     <button class="btn ghost" onclick="alert('Editing happens in the front end; every edit auto-serialises to the pack (hashable source of truth). Excel is the OUTPUT: the full completed model.')">How editing works</button>
     <button class="btn run" onclick="RAN=true;renderSB()">Run against vintage ${VN}</button>
     <button class="btn ghost" onclick="ED={tau:-0.30,gdpIN:6.6,sp100:10};RAN=false;renderSB()">Reset</button></div>
    <div class="runstrip"><span>base: <b>${VN}</b></span><span>pack: <b>${hash()}</b></span><span>run: <b>${RAN?"r-"+hash().slice(3)+"-01 &#10003;":"not yet run"}</b></span></div>
    ${RAN?`<div class="card" style="margin-top:12px"><h3>Promote to vintage - governed, not a save button</h3>
      <div class="check"><span>Identities T-A .. T-F</span><b class="pos">pass</b></div>

function bcSplit(r){ // segment-level splits: engine-endogenous drift by default; a user PATH (a>b) overrides the drift
  const P=r.P;const gTd=P.gT/100;

  let dsh=P.domSh/100;
  for(let i=0;i<YRS.length;i++){const y=YRS[i];
    if(P.hasPath("domSh"))dsh=P.pf("domSh",y)/100;
    else if(y>BY+1&&dsh>0){const gr=r.u[i]/r.u[i-1]-1;const gd=gTd+(gr-gTd)*0.55; // domestic carries ~55% of the excess growth
      dsh=Math.max(0,Math.min(1,dsh*(1+gd)/(1+gr)));}

         <tr><td>Airport income regression bG</td><td class="num"><b>${E.bG_est!=null?E.bG_est.toFixed(2):"not estimated"}</b></td><td class="mut">R&#178; ${E.r2!=null?E.r2.toFixed(2):"-"}, t ${E.t!=null?E.t.toFixed(1):"-"}, n ${E.n||"-"}</td></tr>
         ${E.income?`<tr><td>Income (per-capita) elasticity</td><td class="num">${E.income.bY.toFixed(2)}</td><td class="mut">R&#178; ${E.income.r2.toFixed(2)}</td></tr>`:""}
         <tr><td>Reliability filter</td><td colspan="2"><b class="${E.reliable?'pos':'neg'}">${E.reliable==null?"-":E.reliable?"passes (R\u00b2\u22650.5, t\u22651.7, in bound)":"fails - not used"}</b></td></tr>
        </table>${stat}</div>
      </div></div>
     <div class="grid2">
     <div>
      <div class="card"><h3>How ${a.n} is driven</h3>
       <p style="font-size:13px;line-height:1.55">Demand is built market by market: each destination grows with <b>its own country's GDP</b> (Oxford Economics), weighted by O&amp;D share, with domestic and home markets on ${a.cty} GDP. The model applies <b>one estimated elasticity for the airport</b>, not a separate regression per market, plus a segment-level fare term and a propensity-to-fly maturity damping. So ${a.c} reads ${(econFull(a).dests||[]).length} country GDP series but a single elasticity.</p>
       <p class="mut" style="font-size:12px;line-height:1.5;margin-top:4px">The headline fit is passengers on <b>total GDP</b>, so it is a GDP elasticity: it absorbs population growth, because total GDP is population times GDP per head. The <b>income elasticity</b> proper regresses passengers per capita on GDP per capita, with population as its own driver (passengers = population x propensity of income). Both are shown where population history is available.</p>
       <div class="runstrip">
        <span>GDP elasticity (total GDP): <b>${E.bG_est!=null?E.bG_est.toFixed(2):"not separately estimated"}</b></span>
        ${E.income?`<span>Income elasticity (per capita): <b>${E.income.bY.toFixed(2)}</b></span>`:""}
        <span>Applied in this forecast: <b>${E.ge.toFixed(2)}</b></span>
        <span>Book bound: <b>${E.bound[0]}-${E.bound[1]}</b></span>
        ${E.n?`<span>obs: <b>${E.n}</b>${E.window?" ("+E.window+")":""}</span>`:""}
        ${E.reliable!=null?`<span>reliability: <b class="${E.reliable?'pos':'neg'}">${E.reliable?"passes filter (used)":"fails filter - falls back to pooled/default"}</b></span>`:""}</div>
       ${capped?`<p style="color:#b3452b;font-size:12px;margin-top:6px">The estimated elasticity ${E.bG_est.toFixed(2)} sits outside the book bound, so the forecast does not apply it directly; it is capped to ${appliedIfCapped.toFixed(2)} pending re-estimation on O&amp;D. Surfacing that is exactly why this page exists.</p>`:""}
       <p class="mut" style="font-size:11.5px;margin-top:6px">Source: ${E.source}.${E.r2!=null?"":" R&#178;, t-stat and the observed scatter fill in from the estimation extract when the engine is re-run; the elasticities shown are the model's actual values."}</p></div>
      <div class="card"><h3>GDP-elasticity fit: ln(passengers) vs ln(total GDP)</h3>${econScatter(slope,E.r2,E.real,E.points)}</div>
      ${E.income&&E.income.points?`<div class="card"><h3>Income-elasticity fit: ln(pax per capita) vs ln(GDP per capita)</h3>${econScatter(E.income.bY,E.income.r2,true,E.income.points)}</div>`:""}
     </div>
     <div>
      <div class="card"><h3>GDP series behind the forecast - ${a.c}'s key markets</h3>${econMarkets(a)}
       <p class="mut" style="font-size:11.5px;margin-top:6px">National GDP or key-market GDP? Each market grows with the series named. A hub reads many country GDPs; a regional airport reads mostly domestic and near-Europe.</p></div>
      <div class="card"><h3>Fare elasticity (segment level, locked)</h3>
       <table><tr><th>Segment</th><th class="num">Fare term</th></tr>${Object.entries(E.bF).map(([k,v])=>`<tr><td>${k}</td><td class="num">${(+v).toFixed(2)}</td></tr>`).join("")}</table>
       <p class="mut" style="font-size:11.5px;margin-top:6px">Segment-level per Method Spec (no airport-level fare elasticity); identified mainly on the 2014-16 fare episode, excluding anomalous fare years.</p></div>
     </div></div>`;}
  if(BC.tab==="deliverable"){
    body=`<div class="grid2"><div class="card"><h3>Full Excel model - the deliverable</h3>
      <div class="check"><span>Every template sheet populated by the engine</span><b class="pos">yes</b></div>
      <div class="check"><span>Parity: engine vs template Output Contract</span><b class="pos">412 / 412 cells within 0.001%</b></div>
      <div class="check"><span>Licence filter (client data + Avia outputs only)</span><b class="pos">pass</b></div>
      <div class="check"><span>All charts embedded (gallery set)</span><b class="pos">yes</b></div>
      <div class="check"><span>Scenario sheet sets (active scenarios, incl. client one-offs)</span><b class="pos">${Object.values(BC.scnOn).filter(Boolean).length} included</b></div>
      <button class="btn tealb" style="margin-top:10px" onclick="alert('Production: writes the complete client model. Post-export Excel edits round-trip to the pack, or the file is review-only.')">Generate full client model (.xlsx)</button>
      <div style="margin-top:8px"><span class="pill grey">Review</span><span class="pill gold">Edit &#8594; round-trip to pack</span><span class="pill prj">Lock &amp; save as client model</span></div></div>
     <div><div class="card"><h3>Backtest with overrides (v1.1) - the accuracy edge</h3>
      <table><tr><th>Fit to 2019, scored 2022-25</th><th class="num">MAPE</th></tr>
       <tr><td>Public baseline model</td><td class="num">6.2%</td></tr>
       <tr><td>With client pack applied</td><td class="num pos"><b>3.4%</b></td></tr></table></div>
      <div class="card"><h3>DDFS module (chained; internal v1.1, airport add-on later)</h3>
       ${(()=>{const S=bcSplit(bes);const A=atmSeries(bes,S);const P=bes.P;
        const totA=y=>A[iY(y)]+P.cargoT*Math.pow(1+P.cargoG/100,y-BY)/P.tPerAtm+P.gaAtmK*Math.pow(1+P.gaG/100,y-BY);
        const dd=y=>Math.round(totA(y)*1000/365*1.15);
        const bh=y=>Math.round(dd(y)*0.09), st=y=>Math.round(bh(y)*0.78);
        return `<table><tr><th>Design day output</th><th class="num">${BY+2}</th><th class="num">${BY+10}</th></tr>
        <tr><td>Design-day ATMs (incl cargo &amp; GA)</td><td class="num">${dd(BY+2)}</td><td class="num">${dd(BY+10)}</td></tr>
        <tr><td>Busy-hour pax (PHP)</td><td class="num">${Math.round(bes.c[iY(BY+2)]*1e6/365*1.3*.085)}</td><td class="num">${Math.round(bes.c[i35]*1e6/365*1.3*.085)}</td></tr>
        <tr><td>Busy-hour ATMs / stands</td><td class="num">${bh(BY+2)} / ${st(BY+2)}</td><td class="num">${bh(BY+10)} / ${st(BY+10)}</td></tr></table>`;})()}
       <p class="mut" style="font-size:11px;margin-top:4px">Per the Avia DDFS method (AUH 2022, Bologna 2023/25, Abha 2025 on Egnyte). All values derive from the current run: total ATMs including cargo and GA, 30th busy hour convention. <b>The DDFS module is the single source for every peak metric</b> - no ratio-based peak figures exist anywhere else in the tool.</p></div></div></div>`;}
  m.innerHTML=`
  <div class="wall"><div class="bar"></div>
   <div><b>Project ${a.n} ${a.c}</b> &nbsp;|&nbsp; base vintage <b>${VN}</b> &nbsp;|&nbsp; namespace <span class="pill prj">project:${a.c.toLowerCase()}</span>
    <div class="mut" style="font-size:11.5px;margin-top:2px"><b>Guard G-V:</b> client data refines THIS forecast, never the global tool. No promote path exists here.</div></div>
   <div style="margin-left:auto;display:flex;gap:8px;align-items:center"><span class="pill pub">public baseline</span>&#8853;<span class="pill prj">client pack (${nOver})</span>
    <button class="btn ghost" onclick="BC={apt:null,gen:false,tab:'inputs',over:{},ovlOn:{tower:false,intv:false,surv:false,plan:false,cdat:false},scnOn:{hi:true,lo:true,shock:false,fail:false,capd:false},bum:{},bumX:[],qsi:{},qsiYr:{},blendN:3,bumApply:false};renderBC()">New project</button></div></div>
  <div class="lvl">${tabBtns}</div>
  ${body}
  <div class="footer">Synthetic data, illustrative only. Editing in the front end; the full Excel model is the output.</div>`;}
function bcSeries(which,opts){
  const a=BC.apt; if(!a) return null; opts=opts||{};
  const raw=bcSeriesRaw(which,opts);
  const real=engineBaseSeries(a.c,"Baseline");
  if(!real||!raw) return raw;
  const rb=bcSeriesRaw("base",{});
  const u=real.map((v,i)=> (rb.u[i]>0 ? v*(raw.u[i]/rb.u[i]) : v));
  return {u, c:constrain(u, raw.capF, raw.P.spillM/100, raw.P.spillS/100), P:raw.P, capF:raw.capF};
}
// ---------- shell ----------
function pickApt(){
  const v=document.getElementById("aptin").value.trim();
  const code=(v.split(" - ")[0]||v).trim().toUpperCase();
  const a=APT2.find(x=>x.c.toUpperCase()===code);
  if(!a){alert("Pick an airport from the list (mockup carries "+APT2.length+" synthetic airports).");return;}
  BC.apt=a;BC.gen=true;BC.tab="inputs";renderBC();}
function setMode(m){["pick","sb","bc"].forEach(x=>document.getElementById("t-"+x).classList.toggle("on",x===m));
  if(m==="pick")renderPick(); if(m==="sb")renderSB(); if(m==="bc")renderBC();}
async function runQSI(code){
  try{const j=await (await fetch("/api/bum?airport="+encodeURIComponent(code)+"&n=10")).json();
    if(j.busy||j.started){QSIPOLL=Date.now()+600000; QSISAW=false; setTimeout(pollBUM,1200);
      alert((j.busy?"Already running ":"Running the QSI optimiser for ")+code+" on the server. Candidates appear in the list as each route completes.");}
    else alert("QSI service did not start: "+(j.error||"unknown"));
  }catch(e){
    alert("QSI route service not reachable.\n\nThis needs qsi_service.py running on the machine that has the QSI tool and databases (the box behind the tunnel). When it is running, this button computes the optimised candidates on demand and streams them in.");
  }
}
async function CK_BOOT(){
  try{
    const R=await fetch("data/cockpit.json"); CK=await R.json();
    try{CKCAND=await (await fetch("data/bum_candidates.json")).json();}catch(e){CKCAND=null;}
    CK.airports.forEach(a=>CKBYI[a.c]=a);
    APT2=CK.airports.map(a=>({c:a.c,n:a.n,cty:a.cty,reg:a.reg,base:a.base,g:a.g,cap:a.cap||0,
      dom:a.dom,cx:a.cx,ge:a.ge||regGe(a.reg),mix:mixOf(a),tpc:tpcOf(a.reg)}));
    ENT=buildENT();
  }catch(e){console.warn("cockpit.json not loaded; using synthetic fallback",e);}
  setMode("pick");
}
CK_BOOT();
async function pollBUM(){
  if(!CK||BC.tab!=="bum")return;
  const active = Date.now()<QSIPOLL || (CKCAND&&CKCAND._status&&CKCAND._status.running);
  if(!active)return;
  try{const nc=await (await fetch("data/bum_candidates.json?_="+Date.now())).json();
    if(nc._status&&nc._status.running)QSISAW=true;
    if(JSON.stringify(nc._status)!==JSON.stringify(CKCAND&&CKCAND._status)){CKCAND=nc;renderBC();}
    if(QSISAW&&nc._status&&!nc._status.running)QSIPOLL=0;   // run finished - stop polling
  }catch(e){}
}
setInterval(pollBUM,4000);
</script>
